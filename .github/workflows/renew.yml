name: Katabump Auto Renew

on:
  schedule:
  - cron: '30 */8 * * *'  # 每天 UTC 0点 (北京时间 8点) 运行,根据服务到期时间自行修改
  workflow_dispatch: # 允许手动触发

jobs:
  Renew-Katabump:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: ⚙ 设置 Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: 🛠️ 安装系统依赖和python依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: 配置warp（使用开源的usque实现，外加下载好的config.json）
      run: |
        ls -al
        # curl https://raw.githubusercontent.com/sudasuio/katabump-renew/refs/heads/main/config.json > config.json
        # curl https://raw.githubusercontent.com/sudasuio/katabump-renew/refs/heads/main/usque > usque
        chmod +x usque
        nohup ./usque socks -b 127.0.0.1 -p 2366 -u myuser -w mypass > usqq.txt 2>&1 &
        # 等待 usque 启动（最多 15 秒），避免启动竞态；随后确认 SOCKS5 端口真正可用
        for i in $(seq 1 15); do
          if pgrep -f "usque socks" > /dev/null 2>&1; then
            echo "✅ usque 进程已启动（第 ${i} 秒）"
            break
          fi
          sleep 1
        done
        if ! timeout 15 bash -c 'until echo > /dev/tcp/127.0.0.1/2366 2>/dev/null; do sleep 1; done'; then
          echo "::error::usque SOCKS5 端口 2366 不可用，以下是 usque 日志："
          cat usqq.txt || true
          exit 1
        fi
        echo "✅ SOCKS5 端口 2366 已就绪"

    - name: ⚙ 设置代理 (sing-box)
      continue-on-error: true
      env:
        NODE_LINK: ${{ secrets.NODE_LINK }}
      run: |
        bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

    - name: 🚀 运行续期脚本
      env:
        KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
        KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 app.py
        
    - name: 🧹 清理旧的工作流运行记录
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
        count=0
        for run_id in $runs; do
          count=$((count + 1))
          if [ $count -gt 1 ]; then
            echo "删除运行记录: $run_id"
            gh run delete $run_id || true
          fi
        done

    - name: 加载时间戳到文件
      run: |
        echo "$(date '+%Y-%m-%d %H:%M:%S')" > timestamp.txt

    - name: 推送时间戳文件到仓库，避免工作流被禁用
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add timestamp.txt
        git commit -m "Update timestamp" || echo "No changes to commit"
        git push
